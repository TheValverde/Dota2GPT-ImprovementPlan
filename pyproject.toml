[project]
name = "dota2-coach"
version = "0.3.0"
description = "Desktop Dota 2 overlay for match coaching and fantasy point tracking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "openai>=1.50.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "pywebview>=5.0",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
dota2-coach = "dota2_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["dota2_coach"]

[tool.hatch.build.targets.wheel.force-include]
"dota2_coach/web/static" = "dota2_coach/web/static"
